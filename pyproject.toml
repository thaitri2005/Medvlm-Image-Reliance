[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medvlm"
version = "1.0.0"
license = {text = "MIT"}
authors = [{name = "Tri Thai Huu", email = "23tri.th@vinuni.edu.vn"},
           {name = "Hung Nguyen Le", email = "23hung.nl@vinuni.edu.vn"}]
description = "Probing image reliance in medical vision-language models: image removal vs in-format probes"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "tqdm",
    "requests",
    "scikit-learn",
    "matplotlib",
    "huggingface_hub",
]

[project.optional-dependencies]
# Dataset loading (PathVQA ships as HF parquet)
data = ["datasets"]
# Anything that actually runs a VLM. Gemma 3 / MedGemma needs transformers >= 4.50.
model = ["torch", "torchvision", "transformers>=4.50", "accelerate", "sentencepiece", "datasets"]
# 4-bit / 8-bit loading on small GPUs (Linux / Colab only)
gpu = ["bitsandbytes; platform_system != 'Windows'"]
dev = ["pytest"]

[project.scripts]
medvlm = "medvlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: needs network or a real model (deselect with -m 'not slow')"]
